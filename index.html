/* screensaver */
const cv=$('#sv'),g=cv.getContext('2d'),W=160,H=90;cv.width=W;cv.height=H;
const P=['#0d0614','#2a1042','#5a1a52','#a02f4a','#e0603a','#ffb000','#ffe08a','#f7f7f2'];
const rc=(c,x,y,w,h)=>{g.fillStyle=c;g.fillRect(x|0,y|0,w|0,h|0)};
function ln(x0,y0,x1,y1,c){g.fillStyle=c;const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))|0||1;for(let i=0;i<=n;i++)g.fillRect((x0+(x1-x0)*i/n)|0,(y0+(y1-y0)*i/n)|0,1,1)}
let sd=7;const rn=()=>(sd=sd*16807%2147483647)/2147483647;
const stars=[...Array(40)].map(()=>[rn()*W,rn()*60,rn()*6]),sky=[...Array(27)].map((_,i)=>[i*6,4+(rn()*16|0)]);
const my=[0,1].map(i=>({c:i?P[5]:P[7],h:[],p:[...Array(4)].map(()=>({x:rn()*W,y:rn()*H,vx:(rn()+.6)*(rn()<.5?-1:1),vy:(rn()+.6)*(rn()<.5?-1:1)}))}));
function owl(x,y,f,c){rc(c,x,y,6,5);rc(c,x+1,y-2,4,2);rc(P[5],x+1,y-1,1,1);rc(P[5],x+4,y-1,1,1);ln(x,y+1,x-8,y+1-f,c);ln(x+6,y+1,x+14,y+1-f,c)}
const SC=[t=>{for(let y=0;y<48;y++)rc(P[Math.min(4,y/9.6|0)],0,y,W,1);
for(let y=-18;y<=8;y++){if(y>-4&&y%3==0)continue;const w=Math.sqrt(324-y*y);rc(P[5],80-w,40+y,2*w,1)}
sky.forEach(([x,h])=>rc(P[0],x,48-h,6,h));rc(P[0],0,48,W,H);
const f=(t*.9)%1;for(let i=0;i<10;i++){const z=(i+f)/10,y=48+z*z*42;rc(P[3],0,y,W,1);if(i%2==0)rc(P[6],79,y,2,Math.max(1,z*5))}
for(let k=-9;k<=9;k++)if(k)ln(80,48,80+k*14,90,P[3])},
t=>{g.fillStyle='rgba(13,6,20,.3)';g.fillRect(0,0,W,H);
stars.forEach(([x,y,p])=>{if(Math.sin(t*2+p)>.7)rc(P[6],x,y*.6,1,1)});
const tr=(x,y,a,l,d,c,i)=>{if(d==0||l<1.5)return;const x2=x+Math.sin(a)*l,y2=y-Math.cos(a)*l;ln(x,y,x2,y2,c);const sp=.42+.16*Math.sin(t*.35+i)+.05*Math.sin(t*1.1+d),sw=.06*Math.sin(t*.8+d*.7+i);tr(x2,y2,a-sp+sw,l*.74,d-1,c,i);tr(x2,y2,a+sp+sw,l*.74,d-1,c,i)};
[[22,P[1],14,7,0],[100,P[1],15,7,2],[58,P[2],18,8,1],[136,P[2],17,8,3],[80,P[5],23,8,4]].forEach(([x,c,l,d,i])=>tr(x,87,Math.sin(t*.5+i)*.05,l,d,c,i));rc(P[2],0,87,W,3)},
t=>{rc(P[0],0,0,W,H);my.forEach(m=>{m.p.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1});m.h.push(m.p.map(p=>[p.x,p.y]));if(m.h.length>7)m.h.shift();m.h.forEach((q,k)=>{g.globalAlpha=(k+1)/m.h.length;for(let j=0;j<4;j++){const a=q[j],b=q[(j+1)%4];ln(a[0],a[1],b[0],b[1],m.c)}});g.globalAlpha=1})},
t=>{g.save();g.globalAlpha=.92;g.translate(W/2,H/2);g.rotate(.012*Math.sin(t*.4)+.01);g.scale(1.035,1.035);g.drawImage(cv,-W/2,-H/2);g.restore();g.fillStyle='rgba(13,6,20,.12)';g.fillRect(0,0,W,H);
const c=P[3+((t*.7|0)%4)],c2=P[7];for(let i=0;i<72;i++){const a=i/72*6.283,r=14+8*Math.sin(a*3+t*2)+5*Math.sin(a*5-t*1.3);rc(c,W/2+Math.cos(a+t*.3)*r*1.5,H/2+Math.sin(a+t*.3)*r,2,2);if(i%6==0)rc(c2,W/2+Math.cos(-a-t*.5)*r*.6,H/2+Math.sin(-a-t*.5)*r*.4,1,1)}}];
let tt=0,last=0;function loop(ts){requestAnimationFrame(loop);if(!svOn||ts-last<66)return;last=ts;tt+=(S&&S.is_playing)?.066:.016;SC[scene](tt)}requestAnimationFrame(loop);
function saver(on){svOn=on;$('#fp').classList.toggle('sv',on);$('#gl').classList.toggle('sv',on);if(on)SC[scene](tt)}

const st=(x,y,s=7)=>`M${x} ${y-s}L${x+2} ${y-2}L${x+s} ${y}L${x+2} ${y+2}L${x} ${y+s}L${x-2} ${y+2}L${x-s} ${y}L${x-2} ${y-2}Z`;
const WG=(x,f)=>`<g transform="translate(${x} 74) scale(${f} 1)"><g class="wg"><path d="M0 0Q-22 -16 -52 -14L-70 -6 -60 -2 -72 6 -58 8 -66 18 -50 16 -54 28 -36 22 -30 34 -14 24Q-4 14 0 6"/><path d="M-6 2-52-8M-6 6-60 6M-8 12-52 20M-10 18-40 28"/></g></g>`;
